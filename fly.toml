app = "atomlytics"
primary_region = "waw"

[build]

[env]
  APP_HOST = "0.0.0.0"
  PORT = "3000"
  MAXMIND_DB_PATH = "GeoLite2-City.mmdb"
  UA_REGEX_PATH = "regexes.yaml"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[deploy]
  release_command = "/app/atomlytics migrate"
